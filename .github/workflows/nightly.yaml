name: Nightly

# Every main build is available as a GitHub prerelease APK, as a signed Android
# App Bundle on Play's internal track, and as an iOS build in TestFlight.

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    name: Build Android artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      has_ios: ${{ steps.ios.outputs.has_ios }}
    steps:
      - uses: actions/checkout@v5

      - id: ios
        env:
          HAS_IOS: ${{ secrets.APPSTORE_KEY_ID != '' && secrets.IOS_DIST_CERT_P12 != '' && secrets.APPLE_TEAM_ID != '' }}
        run: echo "has_ios=$HAS_IOS" >> "$GITHUB_OUTPUT"

      - name: Allocate a monotonically increasing Play version code
        id: version
        run: |
          # Seconds since 2020 fit Play's signed 32-bit limit until 2088 and
          # are greater than the manually assigned historic version codes.
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: //')" >> "$GITHUB_OUTPUT"
          echo "code=$(( $(date -u +%s) - 1577836800 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - run: flutter build appbundle --release --build-number=${{ steps.version.outputs.code }}
      - run: flutter build apk --release --build-number=${{ steps.version.outputs.code }}

      - uses: actions/upload-artifact@v6
        with:
          name: nightly-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  publish-play:
    name: Publish internal testing build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: google-play-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes from commits since the last nightly
        run: python3 .github/scripts/nightly_notes.py --base auto --output nightly-notes.txt

      - uses: actions/download-artifact@v7
        with:
          name: nightly-android
          path: artifacts

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/47940350172/locations/global/workloadIdentityPools/github-actions/providers/mobile-app
          audience: https://github.com/librescoot
          service_account: librescoot-play-publisher@android-apps-508215.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Play internal testing
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 .github/scripts/publish_play.py \
            --aab artifacts/bundle/release/app-release.aab \
            --track internal \
            --name "Nightly ${{ needs.build.outputs.version }}" \
            --version-code "${{ needs.build.outputs.version_code }}" \
            --notes-file nightly-notes.txt

  publish-testflight:
    name: Publish TestFlight build
    if: github.event_name == 'push' && needs.build.outputs.has_ios == 'true'
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate notes from commits since the last nightly
        run: python3 .github/scripts/nightly_notes.py --base auto --output testflight-notes.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Fetch app provisioning profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: org.librescoot.mobile.unu
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Fetch widget extension profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: org.librescoot.mobile.unu.ScooterWidget
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      # The profile names below are pinned in project.pbxproj and
      # ExportOptions.plist, so a rotated certificate would otherwise surface as
      # a confusing signing failure after the archive has already run.
      - name: Verify signing profiles
        run: |
          python3 .github/scripts/verify_signing_profiles.py \
            --require "org.librescoot.mobile.unu=Librescoot App Store CI" \
            --require "org.librescoot.mobile.unu.ScooterWidget=Librescoot Widget App Store CI"

      - name: Write export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.librescoot.mobile.unu</key>
              <string>Librescoot App Store CI</string>
              <key>org.librescoot.mobile.unu.ScooterWidget</key>
              <string>Librescoot Widget App Store CI</string>
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint ios/ExportOptions.plist

      - name: Build iOS IPA
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)"
          flutter build ipa --release \
            --build-name="${VERSION%%-*}" \
            --build-number="${{ needs.build.outputs.version_code }}" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Locate iOS IPA
        id: ipa
        run: |
          IPA="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Publish What to Test notes
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          python3 .github/scripts/testflight_notes.py \
            --build-number "${{ needs.build.outputs.version_code }}" \
            --notes-file testflight-notes.txt \
            --issuer-id "${{ secrets.APPSTORE_ISSUER_ID }}" \
            --key-id "${{ secrets.APPSTORE_KEY_ID }}"

      - uses: actions/upload-artifact@v6
        with:
          name: nightly-ios
          path: build/ios/ipa/*.ipa
          retention-days: 14

  release:
    name: Publish nightly
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: nightly-android
          path: artifacts

      - name: Collect build facts
        id: facts
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.facts.outputs.tag }}
          name: Nightly ${{ steps.facts.outputs.date }}
          body: |
            Automated build from `main`, also published to Play internal testing and TestFlight.

            **Version:** ${{ needs.build.outputs.version }}
            **Store build number:** ${{ needs.build.outputs.version_code }}
            **Commit:** ${{ github.sha }}
          files: artifacts/flutter-apk/app-release.apk
          prerelease: true

      - name: Prune old nightlies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("nightly-"))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r tag; do
              echo "Removing $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
