name: Nightly

# Every main build is available both as a GitHub prerelease APK and as a signed
# Android App Bundle on Play's internal track.

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    name: Build Android artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Allocate a monotonically increasing Play version code
        id: version
        run: |
          # Seconds since 2020 fit Play's signed 32-bit limit until 2088 and
          # are greater than the manually assigned historic version codes.
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: //')" >> "$GITHUB_OUTPUT"
          echo "code=$(( $(date -u +%s) - 1577836800 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - run: flutter build appbundle --release --build-number=${{ steps.version.outputs.code }}
      - run: flutter build apk --release --build-number=${{ steps.version.outputs.code }}

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  publish-play:
    name: Publish internal testing build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes from commits since the last nightly
        id: notes
        run: |
          PREV="$(git tag --list 'nightly-*' --sort=-creatordate | head -1 || true)"
          if [ -n "$PREV" ]; then
            python3 .github/scripts/nightly_notes.py --base "$PREV" --output nightly-notes.txt
            echo "base=$PREV" >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/nightly_notes.py --output nightly-notes.txt
            echo "base=(none; using recent commits)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: nightly-android
          path: artifacts

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/47940350172/locations/global/workloadIdentityPools/github-actions/providers/mobile-app
          audience: https://github.com/librescoot
          service_account: librescoot-play-publisher@android-apps-508215.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Play internal testing
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 .github/scripts/publish_play.py \
            --aab artifacts/bundle/release/app-release.aab \
            --track internal \
            --name "Nightly ${{ needs.build.outputs.version }}" \
            --version-code "${{ needs.build.outputs.version_code }}" \
            --notes-file nightly-notes.txt

  release:
    name: Publish nightly
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nightly-android
          path: artifacts

      - name: Collect build facts
        id: facts
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.facts.outputs.tag }}
          name: Nightly ${{ steps.facts.outputs.date }}
          body: |
            Automated build from `main`, also published to Play internal testing.

            **Version:** ${{ needs.build.outputs.version }}
            **Play version code:** ${{ needs.build.outputs.version_code }}
            **Commit:** ${{ github.sha }}
          files: artifacts/flutter-apk/app-release.apk
          prerelease: true

      - name: Prune old nightlies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("nightly-"))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r tag; do
              echo "Removing $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
