name: Native builds

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      signing_setup:
        description: Explicit Apple account setup only; associate the App Group in the developer portal between phases
        type: choice
        options: [none, register, profiles]
        default: none

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_setup != 'none' && 'watch-signing-setup' || format('native-builds-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.signing_setup == 'none' }}

jobs:
  configure-signing:
    name: Configure watch signing resources
    if: github.event_name == 'workflow_dispatch' && inputs.signing_setup != 'none' && github.repository == 'librescoot/mobile-app'
    runs-on: ${{ inputs.signing_setup == 'register' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Import existing CI distribution identity
        if: inputs.signing_setup == 'profiles'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      - name: Apply the requested setup phase
        env:
          SETUP_PHASE: ${{ inputs.signing_setup }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: python3 .github/scripts/configure_watch_signing.py --phase "$SETUP_PHASE" --apply

  android:
    name: Android phone and Wear OS
    if: github.event_name != 'workflow_dispatch' || inputs.signing_setup == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Build and test Wear OS
        working-directory: android
        run: ./gradlew :wear:assembleDebug :wear:testDebugUnitTest :wear:lintDebug
      - name: Configure disposable signing for the release build check
        run: |
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$RUNNER_TEMP/build-check.jks" -alias build-check \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 1 -dname 'CN=CI build check'
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=build-check
          storeFile=$RUNNER_TEMP/build-check.jks
          EOF
      - name: Build release Wear OS bundle
        run: android/gradlew -p android :wear:bundleRelease -PwearVersionCode=1 -PwearVersionName=0.1.0
      - run: flutter build appbundle --release

  apple:
    name: iOS archive and watchOS simulator
    if: github.event_name != 'workflow_dispatch' || inputs.signing_setup == 'none'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: swift test --package-path ios/WatchSupport
      - name: Archive iOS and embedded watch targets without signing
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          flutter build ipa --release --no-codesign --build-name="${VERSION%%-*}"
          test -d build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Watch/ScooterWatch.app/PlugIns/ScooterWatchWidget.appex
      - name: Build watchOS simulator app and complications
        run: |
          xcodebuild -project ios/Runner.xcodeproj -scheme ScooterWatch \
            -configuration Debug -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Prepare distribution signing on trusted pushes
        if: github.repository == 'librescoot/mobile-app' && github.event_name != 'pull_request'
        uses: ./.github/actions/ios-signing
        with:
          certificate: ${{ secrets.IOS_DIST_CERT_P12 }}
          certificate-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          key-id: ${{ secrets.APPSTORE_KEY_ID }}
          private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      - name: Verify signed IPA export without uploading
        if: github.repository == 'librescoot/mobile-app' && github.event_name != 'pull_request'
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          flutter build ipa --release --build-name="${VERSION%%-*}" \
            --export-options-plist=ios/ExportOptions.plist
          compgen -G 'build/ios/ipa/*.ipa' > /dev/null
      - name: Verify phone simulator launch
        run: bash .github/scripts/smoke_ios_simulator.sh
