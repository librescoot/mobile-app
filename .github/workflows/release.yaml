name: Release

# Fires on a version tag (1.3.1, 1.3.1-beta.1, ...). Builds a signed Android
# bundle and an iOS archive, uploads iOS to TestFlight when configured, and
# publishes Android through keyless GitHub OIDC authentication. No
# service-account key is stored or consumed.
#
# A tag carrying a hyphen is marked as a GitHub prerelease. Prereleases go to
# internal testing; releases without a suffix go to beta unless manually set.

permissions:
  contents: write

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      play_track:
        description: Play track to publish to
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      play_track: ${{ steps.v.outputs.play_track }}
      has_ios: ${{ steps.ios.outputs.has_ios }}
    steps:
      - uses: actions/checkout@v5

      # Job-level `if` cannot see the secrets context, so the presence check
      # has to happen in a step and travel to the iOS job as an output.
      - id: ios
        env:
          HAS_IOS: ${{ secrets.APPSTORE_KEY_ID != '' && secrets.IOS_DIST_CERT_P12 != '' && secrets.APPLE_TEAM_ID != '' }}
        run: echo "has_ios=$HAS_IOS" >> "$GITHUB_OUTPUT"
      - id: v
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
            VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)"

          # A hyphen in a semver tag means prerelease, by definition.
          case "$VERSION" in
            *-*) PRE=true ;;
            *)   PRE=false ;;
          esac

          TRACK="${{ inputs.play_track }}"
          if [ -z "$TRACK" ]; then
            [ "$PRE" = "true" ] && TRACK=internal || TRACK=beta
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "play_track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (prerelease=$PRE) to Play track $TRACK"

      - name: Refuse to release a version pubspec disagrees with
        if: github.event_name == 'push'
        run: |
          PUBSPEC="$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)"
          if [ "$PUBSPEC" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag is ${GITHUB_REF_NAME} but pubspec.yaml says $PUBSPEC."
            echo "Bump pubspec and retag rather than shipping a mislabelled build."
            exit 1
          fi

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: meta
    outputs:
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v5

      - name: Allocate a monotonically increasing Play version code
        id: version
        run: |
          # Seconds since 2020 fit Play's signed 32-bit limit until 2088 and
          # are greater than the manually assigned historic version codes.
          echo "code=$(( $(date -u +%s) - 1577836800 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # Play takes the bundle; the APK is for the GitHub release, so people can
      # sideload without going through the store.
      - run: flutter build appbundle --release --build-number=${{ steps.version.outputs.code }}
      - run: flutter build apk --release --build-number=${{ steps.version.outputs.code }}

      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

  play:
    name: Google Play (${{ needs.meta.outputs.play_track }})
    runs-on: ubuntu-latest
    needs: [meta, android]
    if: needs.android.result == 'success'
    environment: ${{ needs.meta.outputs.play_track }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: android
          path: artifacts

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/47940350172/locations/global/workloadIdentityPools/github-actions/providers/mobile-app
          audience: https://github.com/librescoot
          service_account: librescoot-play-publisher@android-apps-508215.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload verified AAB
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 .github/scripts/publish_play.py \
            --aab artifacts/bundle/release/app-release.aab \
            --track "${{ needs.meta.outputs.play_track }}" \
            --name "${{ needs.meta.outputs.version }}" \
            --version-code "${{ needs.android.outputs.version_code }}" \
            --notes-dir distribution/play/metadata/android \
            --notes-version "${{ needs.meta.outputs.version }}"

  ios:
    name: iOS
    runs-on: macos-latest
    needs: meta
    if: needs.meta.outputs.has_ios == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      # Pulled from App Store Connect rather than stored as secrets, so the
      # profiles cannot silently go stale against the certificate.
      - name: Fetch provisioning profiles
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: org.librescoot.mobile.unu
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Fetch widget extension profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: org.librescoot.mobile.unu.ScooterWidget
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      # Generated here rather than committed: the team ID is account data, and
      # Xcode's $(VAR) syntax does not expand inside an export options plist.
      - name: Write export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.librescoot.mobile.unu</key>
              <string>Librescoot App Store CI</string>
              <key>org.librescoot.mobile.unu.ScooterWidget</key>
              <string>Librescoot Widget App Store CI</string>
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint ios/ExportOptions.plist

      - run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Locate iOS IPA
        id: ipa
        run: |
          IPA="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - uses: actions/upload-artifact@v6
        with:
          name: ios
          path: build/ios/ipa/*.ipa

  publish:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [meta, android, ios, play]
    # iOS is allowed to fail without sinking the Android release, since the
    # UIScene migration is not merged yet and iOS may not build cleanly.
    if: github.event_name == 'push' && always() && needs.android.result == 'success' && needs.play.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Librescoot App for unu ${{ needs.meta.outputs.version }}
          body_path: changelog.md
          prerelease: ${{ needs.meta.outputs.prerelease }}
          files: |
            artifacts/android/**/*.aab
            artifacts/android/**/*.apk
            artifacts/ios/*.ipa
