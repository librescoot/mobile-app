name: Submit App Store release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Exact processed iOS 1.3.2 build number
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Submit the verified iOS patch
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 .github/scripts/submit_patch_release.py --build-number "$BUILD_NUMBER"
