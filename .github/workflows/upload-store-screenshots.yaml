name: Upload App Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download reviewed simulator captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p screenshots/watch
          gh run download 40502163656 -n watch-simulator-screenshot -D screenshots/watch
          sips -s format jpeg screenshots/watch/watch.png --out screenshots/watch.jpg >/dev/null
      - name: Upload screenshots to App Store Connect
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: python3 .github/scripts/upload_app_store_screenshots.py
