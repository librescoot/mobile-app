name: Test build

# On-demand signed phone/watch artifacts, with explicit optional Wear OS
# closed-testing publication. No GitHub release is created.

on:
  workflow_dispatch:
    inputs:
      inspect_wear_testing:
        description: Inspect Play Wear OS tracks and tester configuration instead of building
        type: boolean
        default: false
      wear:
        description: Build signed Wear OS APK and App Bundle instead of the phone APK
        type: boolean
        default: false
      publish_wear:
        description: Publish Wear OS to wear:alpha (requires wear=true and the Console closed track/testers configured)
        type: boolean
        default: false
      upload_wear_screenshots:
        description: Upload the verified Wear OS screenshots to every existing localized Play listing
        type: boolean
        default: false
      upload_wear_bundle:
        description: Add an existing Wear AAB to Play's bundle library without releasing it
        type: boolean
        default: false
      wear_bundle_run_id:
        description: Successful Test build run ID containing the wear-bundle artifact
        type: string
        default: ''

concurrency:
  group: testbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build test artifacts
    if: ${{ !inputs.inspect_wear_testing && !inputs.upload_wear_screenshots && !inputs.upload_wear_bundle }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get

      # Signed with the upload key so these can install over a nightly or a
      # store build without an uninstall.
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<KEY
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          KEY

      - if: ${{ !inputs.wear }}
        run: flutter build apk --release

      - name: Build signed Wear OS artifacts
        if: inputs.wear
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          CODE="$(( $(date -u +%s) - 1577836800 ))"
          flutter build apk --config-only --release --build-name="$VERSION" --build-number="$CODE"
          android/gradlew -p android :wear:assembleRelease :wear:bundleRelease \
            -PwearVersionName="$VERSION" -PwearVersionCode="$CODE"
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          "$AAPT" dump badging build/wear/outputs/apk/release/wear-release.apk | grep -F "uses-feature: name='android.hardware.type.watch'"
          ! "$AAPT" dump badging build/wear/outputs/apk/release/wear-release.apk | grep -F "uses-feature-not-required: name='android.hardware.type.watch'"
          echo "$CODE" > build/wear/version-code.txt
          echo "$VERSION" > build/wear/version-name.txt

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.wear && 'wear-testing' || 'apk' }}
          path: ${{ inputs.wear && 'build/wear/outputs/apk/release/*.apk' || 'build/app/outputs/flutter-apk/app-release.apk' }}
          retention-days: 14

      - if: inputs.wear
        uses: actions/upload-artifact@v6
        with:
          name: wear-bundle
          path: |
            build/wear/outputs/bundle/release/*.aab
            build/wear/version-code.txt
            build/wear/version-name.txt
          retention-days: 14

  publish-wear:
    name: Publish Wear OS closed testing
    if: inputs.wear && inputs.publish_wear && !inputs.inspect_wear_testing && !inputs.upload_wear_screenshots && !inputs.upload_wear_bundle
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: google-play-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: wear-bundle
          path: wear-artifacts
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/47940350172/locations/global/workloadIdentityPools/github-actions/providers/mobile-app
          audience: https://github.com/librescoot
          service_account: librescoot-play-publisher@android-apps-508215.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Publish verified watch bundle without changing the phone track
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          CODE="$(<wear-artifacts/version-code.txt)"
          VERSION="$(<wear-artifacts/version-name.txt)"
          python3 .github/scripts/publish_play.py \
            --aab wear-artifacts/outputs/bundle/release/wear-release.aab \
            --track wear:alpha --name "Wear OS $VERSION" --version-code "$CODE" \
            --notes-file distribution/wearable-testing.txt

  inspect-wear:
    name: Inspect Wear OS testing setup
    if: inputs.inspect_wear_testing && !inputs.upload_wear_screenshots && !inputs.upload_wear_bundle
    runs-on: ubuntu-latest
    concurrency:
      group: google-play-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/47940350172/locations/global/workloadIdentityPools/github-actions/providers/mobile-app
          audience: https://github.com/librescoot
          service_account: librescoot-play-publisher@android-apps-508215.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Read tracks and tester configuration without committing an edit
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          sys.path.insert(0, '.github/scripts')
          from publish_play import BASE, request
          token = os.environ['GOOGLE_OAUTH_ACCESS_TOKEN']
          edit = request(token, 'POST', f'{BASE}/edits', b'{}')['id']
          try:
              tracks = request(token, 'GET', f'{BASE}/edits/{edit}/tracks').get('tracks', [])
              print(json.dumps(tracks, indent=2))
              for track in tracks:
                  name = track['track']
                  if name == 'alpha' or name.startswith('wear:'):
                      testers = request(token, 'GET', f'{BASE}/edits/{edit}/testers/{name}')
                      print(f"{name}: tester fields {list(testers)}, Google groups {len(testers.get('googleGroups', []))}")
          finally:
              req = urllib.request.Request(f'{BASE}/edits/{edit}', method='DELETE', headers={'Authorization': f'Bearer {token}'})
              with urllib.request.urlopen(req, timeout=30):
                  pass
          PY

  upload-wear-screenshots:
    name: Upload Wear OS screenshots to Play listings
    if: inputs.upload_wear_screenshots && !inputs.inspect_wear_testing && github.repository == 'librescoot/mobile-app'
    runs-on: ubuntu-latest
    concurrency:
      group: google-play-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/47940350172/locations/global/workloadIdentityPools/github-actions/providers/mobile-app
          audience: https://github.com/librescoot
          service_account: librescoot-play-publisher@android-apps-508215.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Add verified screenshots without removing existing listing images
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 .github/scripts/upload_wear_screenshots.py

  upload-wear-bundle-library:
    name: Upload Wear AAB to Play bundle library only
    if: inputs.upload_wear_bundle && !inputs.upload_wear_screenshots && !inputs.inspect_wear_testing && !inputs.publish_wear && !inputs.wear && inputs.wear_bundle_run_id != '' && github.repository == 'librescoot/mobile-app'
    runs-on: ubuntu-latest
    concurrency:
      group: google-play-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: wear-bundle
          path: wear-bundle
          run-id: ${{ inputs.wear_bundle_run_id }}
          github-token: ${{ github.token }}
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/47940350172/locations/global/workloadIdentityPools/github-actions/providers/mobile-app
          audience: https://github.com/librescoot
          service_account: librescoot-play-publisher@android-apps-508215.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Verify artifact metadata
        env:
          WEAR_BUNDLE_RUN_ID: ${{ inputs.wear_bundle_run_id }}
        run: |
          [[ "$WEAR_BUNDLE_RUN_ID" =~ ^[0-9]+$ ]]
          test -s wear-bundle/outputs/bundle/release/wear-release.aab
          test -s wear-bundle/version-code.txt
      - name: Upload bundle without assigning it to a track
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 .github/scripts/upload_play_bundle_library.py wear-bundle/outputs/bundle/release/wear-release.aab wear-bundle/version-code.txt
