name: CI

# Analyze and test on every push and PR. Builds live in nightly.yaml (main)
# and release.yaml (tags); this job only has to be fast enough that nobody
# minds waiting for it.

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Resolve and verify shared core
        working-directory: packages/scooter_core
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Resolve and verify shared Flutter integration
        working-directory: packages/scooter_flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test
