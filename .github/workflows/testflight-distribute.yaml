name: Distribute existing TestFlight beta

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Existing TestFlight build number
        required: true
        type: string
      notes_version:
        description: Prerelease tag for the localized notes (e.g. 1.3.0-beta.12)
        required: true
        type: string

permissions:
  contents: read

jobs:
  distribute:
    name: Assign build to external testers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publish notes and distribute the existing build
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          NOTES_VERSION: ${{ inputs.notes_version }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$NOTES_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          python3 .github/scripts/testflight_notes.py \
            --build-number "$BUILD_NUMBER" \
            --notes-dir distribution/play/metadata/android \
            --notes-version "$NOTES_VERSION" \
            --external-group "External Testing"
