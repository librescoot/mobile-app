name: Build corrected iOS release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect App Store review state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect review submissions
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: python3 .github/scripts/inspect_review_state.py
  ios:
    name: Build and upload corrected watch icon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test watch icon
        run: flutter test --no-pub test/architecture/watch_icon_test.dart
      - name: Prepare iOS and watchOS signing
        uses: ./.github/actions/ios-signing
        with:
          certificate: ${{ secrets.IOS_DIST_CERT_P12 }}
          certificate-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          key-id: ${{ secrets.APPSTORE_KEY_ID }}
          private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      - name: Build iOS IPA
        id: version
        run: |
          test "$(grep '^version:' pubspec.yaml | cut -d ' ' -f2 | cut -d+ -f1)" = 1.3.2
          BUILD_NUMBER="$(( $(date -u +%s) - 1577836800 ))"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          shasum -a 256 ios/ScooterWatch/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          flutter build ipa --release --build-name=1.3.2 --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist
      - name: Verify document-only iOS picker
        run: python3 .github/scripts/check_ios_picker.py
      - name: Locate and inspect IPA
        id: ipa
        run: |
          IPA="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          unzip -l "$IPA" > /tmp/ipa-contents.txt
          grep -E '/Watch/[^/]+\.app/Assets\.car$' /tmp/ipa-contents.txt
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      - name: Wait for valid build and publish notes
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          python3 .github/scripts/testflight_notes.py \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --notes-dir distribution/play/metadata/android \
            --notes-version 1.3.2 \
            --issuer-id "${{ secrets.APPSTORE_ISSUER_ID }}" \
            --key-id "${{ secrets.APPSTORE_KEY_ID }}"
      - uses: actions/upload-artifact@v6
        with:
          name: corrected-ios
          path: build/ios/ipa/*.ipa
