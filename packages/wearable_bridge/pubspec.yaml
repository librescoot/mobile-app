name: wearable_bridge
description: Local wearable companion transport for the scooter app.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: org.librescoot.companion
        pluginClass: WearableBridgePlugin
      ios:
        pluginClass: WearableBridgePlugin
