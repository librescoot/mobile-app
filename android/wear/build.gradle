plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'org.librescoot.watch'
    compileSdk 36
    defaultConfig {
        applicationId 'org.librescoot.mobile.unu'
        minSdk 30
        targetSdk 36
        versionCode providers.gradleProperty('wearVersionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('wearVersionName').getOrElse('0.1.0')
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? rootProject.file('app').toPath().resolve(keystoreProperties['storeFile']).toFile() : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all { systemProperty 'companionContract', rootProject.file('../test/fixtures/companion_contract.json').absolutePath }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    implementation 'androidx.wear.tiles:tiles:1.4.1'
    implementation 'androidx.wear.protolayout:protolayout:1.2.1'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
